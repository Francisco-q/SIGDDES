services:
  - type: web
    name: safevg-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_superuser"
    startCommand: "gunicorn django_crud_api.wsgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: django_crud_api.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DB_NAME
        fromDatabase:
          name: safevg-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: safevg-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: safevg-postgres
          property: password
      - key: DB_HOST
        fromDatabase:
          name: safevg-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: safevg-postgres
          property: port
      - key: FRONTEND_URL
        value: https://safevg.vercel.app
      # Variables del superusuario - SE CONFIGURAN EN RENDER DASHBOARD
      - key: SUPERUSER_USERNAME
        sync: false  # Se configura manualmente en Render
      - key: SUPERUSER_EMAIL
        sync: false  # Se configura manualmente en Render  
      - key: SUPERUSER_PASSWORD
        sync: false  # Se configura manualmente en Render

databases:
  - name: safevg-postgres
    databaseName: safevg_production
    user: safevg_user
    plan: free
    region: oregon
